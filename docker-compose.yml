# ============================================================
# Docker Compose — Desenvolvimento local e referência
# ============================================================
# Para rodar tudo via Docker: docker compose up --build
# No Coolify: cada serviço é deployado como recurso separado
# ============================================================

services:
  # --------------------------------------------------------
  # PocketBase — Backend/BaaS
  # --------------------------------------------------------
  pocketbase:
    build:
      context: ./apps/pocketbase
      dockerfile: Dockerfile
      args:
        PB_VERSION: "0.39.4"
    env_file:
      - ./apps/pocketbase/.env
    ports:
      - "8090:8090"
    volumes:
      - pb_data:/app/pb_data
      - ./apps/pocketbase/pb_migrations:/app/pb_migrations
      - ./apps/pocketbase/pb_hooks:/app/pb_hooks

    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8090/api/health" ]
      interval: 10s
      timeout: 5s
      retries: 3

  # --------------------------------------------------------
  # Web — Frontend SvelteKit
  # --------------------------------------------------------
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        PUBLIC_POCKETBASE_URL: "http://127.0.0.1:8090"
        PUBLIC_MERCADO_PAGO_PUBLIC_KEY: "${PUBLIC_MERCADO_PAGO_PUBLIC_KEY}"
    ports:
      - "5173:80"

    env_file:
      - ./apps/web/.env
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    depends_on:
      pocketbase:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pb_data:
    name: wedding_pb_data
    driver: local
